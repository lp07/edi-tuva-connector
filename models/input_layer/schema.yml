version: 2

models:
  - name: medical_claim
    description: >
      Tuva-compliant medical_claim input layer table built from parsed EDI 837 claim
      and 835 remittance data. Each row represents one claim with clinical and financial
      fields mapped to the Tuva input layer specification.
    columns:
      - name: claim_id
        description: Unique claim identifier from the 837 CLM01 segment.
        tests:
          - not_null
          - unique

      - name: claim_type
        description: Claim type. Values are professional or institutional.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['professional', 'institutional']

      - name: patient_id
        description: Patient identifier.
        tests:
          - not_null

      - name: claim_start_date
        description: Claim start date from the 837 DTP segment.
        tests:
          - not_null

      - name: charge_amount
        description: Total billed amount from the 837 CLM02 segment.
        tests:
          - not_null

      - name: data_source_name
        description: Identifies the source system that produced this data.
        tests:
          - not_null