version: 2

sources:
  - name: edi_parsed
    description: >
      Parsed EDI output from edi_parser.py, one row per claim with nested arrays.
      DuckDB reads the JSON files directly via external_location (read_json_auto).
      Snowflake reads raw tables, each a single VARIANT column named `record`,
      loaded by the load script into the database and schema set by the vars
      below (raw schema defaults to edi_raw).
    database: "{{ var('snowflake_database', none) }}"
    schema: "{{ var('snowflake_raw_schema', 'edi_raw') }}"
    meta:
      external_location: "read_json_auto('sample_data/parsed/{name}.json')"
    tables:
      - name: claims_837
      - name: remit_835
