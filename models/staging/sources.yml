version: 2

sources:
  - name: edi_raw
    schema: main_edi_raw
    description: Parsed EDI 837 and 835 data produced by the upstream Python reconciliation pipeline.
    tables:
      - name: reconciliation_report
        description: >
          Combined claim and remittance data output from the EDI 837/835 reconciliation engine.
          Each row represents one claim with payment and adjustment details from the matched 835 remittance.
        columns:
          - name: claim_id
            description: Unique claim identifier from the 837 CLM01 segment.
          - name: patient_id
            description: Patient identifier.
          - name: payer
            description: Payer name from the 835 remittance.
          - name: procedure_code
            description: CPT or HCPCS procedure code from the 837 SV1 segment.
          - name: date_of_service
            description: Date of service from the 837 DTP segment with qualifier 472.
          - name: date_submitted
            description: Date the claim was submitted to the payer.
          - name: billed_amount
            description: Total charge amount from the 837 CLM02 segment.
          - name: allowed_amount
            description: Contractually allowed amount from the 835 AMT segment with qualifier B6.
          - name: paid_amount
            description: Amount paid by the payer from the 835 CLP04 element.
          - name: patient_responsibility
            description: Patient responsibility amount from the 835 CAS segments with group code PR.
          - name: contractual_adjustment
            description: Contractual write-off amount from the 835 CAS segments with group code CO.
          - name: remittance_date
            description: Date the remittance was issued from the 835 DTM segment with qualifier 405.
          - name: days_to_payment
            description: Calculated field representing days between date submitted and remittance date.
          - name: status
            description: Reconciliation status assigned by the matching engine. Values include matched, underpayment, denial, reversal, orphaned_remit, orphaned_claim.
          - name: denial_category
            description: Denial classification assigned by the classifier module.
          - name: carc_codes
            description: Claim adjustment reason codes from the 835 CAS02 element.
          - name: rarc_codes
            description: Remittance advice remark codes from the 835 LQ segment.
          - name: primary_carc
            description: The primary claim adjustment reason code driving the payment variance.
          - name: contracted_rate
            description: Expected payment amount based on payer contract configuration.
          - name: variance_amount
            description: Difference between paid amount and contracted rate.
          - name: variance_pct
            description: Variance expressed as a percentage of the contracted rate.
          - name: recovery_amount
            description: Amount identified as recoverable through appeal or correction.
          - name: check_number
            description: Payer check or EFT reference number from the 835 TRN02 element.