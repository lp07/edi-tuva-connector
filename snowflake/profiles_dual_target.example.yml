# Merge into ~/.dbt/profiles.yml. Default target is duckdb so daily dev is free
# and offline; switch with:  dbt run --target snowflake
# Snowflake auth uses an RSA key pair (also satisfies the MFA requirement).
# Register the public key once:  alter user <you> set rsa_public_key='<body>';
# Credentials come from environment variables; commit no secrets.
edi_tuva_connector:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      threads: 1
    prod:
      type: duckdb
      path: prod.duckdb
      threads: 4
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'edi_tuva') }}"
      threads: 4
